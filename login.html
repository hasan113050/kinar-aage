<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
  name="robots"
  content="noindex, nofollow"
>

  <title>Kinar Aage Admin Login</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f5f5f5;
      font-family: "Inter", sans-serif;
      color: #212121;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 36px;
      border-radius: 18px;
      background: #ffffff;
      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.08);
    }

    .login-brand {
      margin-bottom: 28px;
      text-align: center;
    }

    .login-brand h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .login-brand h1 span {
      color: #f85606;
    }

    .login-brand p {
      margin-top: 8px;
      color: #757575;
      font-size: 13px;
    }

    .login-form {
      display: grid;
      gap: 16px;
    }

    .field-group {
      display: grid;
      gap: 7px;
    }

    .field-group label {
      font-size: 12px;
      font-weight: 700;
    }

    .field-group input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid #e5e5e5;
      border-radius: 9px;
      outline: none;
      background: #fafafa;
      color: #212121;
      font-size: 13px;
      transition: 0.2s ease;
    }

    .field-group input:focus {
      border-color: #f85606;
      background: #ffffff;
      box-shadow:
        0 0 0 3px rgba(248, 86, 6, 0.08);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 52px;
    }

    .password-toggle-button {
      position: absolute;
      top: 50%;
      right: 9px;
      transform: translateY(-50%);

      width: 34px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: none;
      border-radius: 8px;
      background: transparent;

      color: #8a8a8a;

      cursor: pointer;
      transition: 0.2s ease;
    }

    .password-toggle-button:hover {
      background: #fff1e8;
      color: #f85606;
    }

    .password-toggle-button:focus {
      outline: none;
      background: #fff1e8;
      color: #f85606;
    }

    .password-toggle-button svg {
      display: block;
      width: 20px;
      height: 20px;
    }

    .forgot-password-wrap {
      margin-top: -4px;
      text-align: right;
    }

    .forgot-password-button {
      border: none;
      background: transparent;
      color: #f85606;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .forgot-password-button:hover {
      color: #d94d05;
    }

    .forgot-password-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login-button {
      width: 100%;
      min-height: 48px;
      margin-top: 4px;
      border: none;
      border-radius: 9px;
      background: #f85606;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .login-button:hover {
      background: #d94d05;
    }

    .login-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .login-message {
      min-height: 20px;
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
    }

    .login-message.error {
      color: #d64545;
    }

    .login-message.success {
      color: #2f7d4b;
    }

    .back-home {
      display: block;
      margin-top: 22px;
      color: #757575;
      font-size: 11px;
      text-align: center;
    }

    .back-home:hover {
      color: #f85606;
    }

  </style>

</head>

<body>

  <div class="login-card">

    <div class="login-brand">

      <h1>
        Kinar <span>Aage</span>
      </h1>

      <p>
        Admin Login
      </p>

    </div>


    <form
      id="adminLoginForm"
      class="login-form"
    >

      <div class="field-group">

        <label for="adminEmail">
          Email
        </label>

        <input
          id="adminEmail"
          type="email"
          autocomplete="email"
          required
        >

      </div>


      <div class="field-group">

        <label for="adminPassword">
          Password
        </label>

        <div class="password-wrap">

          <input
            id="adminPassword"
            type="password"
            autocomplete="current-password"
            required
          >

          <button
            id="togglePasswordButton"
            class="password-toggle-button"
            type="button"
            aria-label="Show password"
          >

            <svg
              id="eyeIcon"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >

              <path
                d="M2.5 12C4.3 7.9 7.6 5.5 12 5.5C16.4 5.5 19.7 7.9 21.5 12C19.7 16.1 16.4 18.5 12 18.5C7.6 18.5 4.3 16.1 2.5 12Z"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />

              <circle
                cx="12"
                cy="12"
                r="2.7"
                stroke="currentColor"
                stroke-width="1.7"
              />

            </svg>

          </button>

        </div>

      </div>


      <div class="forgot-password-wrap">

        <button
          id="forgotPasswordButton"
          class="forgot-password-button"
          type="button"
        >
          Forgot Password?
        </button>

      </div>


      <button
        id="adminLoginButton"
        class="login-button"
        type="submit"
      >
        Login
      </button>

    </form>


    <div
      id="loginMessage"
      class="login-message"
    ></div>


    <a
      href="index.html"
      class="back-home"
    >
      ← Back to Website
    </a>

  </div>



  <script
    type="module"
    src="login.js"
  ></script>

</body>

</html>
